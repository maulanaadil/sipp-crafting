"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# migration is idempotent; skipped quietly when the database is not reachable so workspace creation never fails on it
setup = "npm ci && (npm run -s db:migrate || echo 'db:migrate skipped - see docs/RUNNING.md')"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.build]
command = "npm run build"
icon = "hammer"

[scripts.run.lint]
command = "npm run lint"
icon = "list-checks"

[scripts.run.test]
command = "npm test"
icon = "test-tube"
